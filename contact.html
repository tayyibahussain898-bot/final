    <h2 style="text-align:center; color:#2563eb; margin-bottom:25px;">

    </h2>

    <div style="display:flex; gap:20px; flex-wrap:wrap;">

        <div style="flex:1; min-width:280px;">
            <label style="font-weight:bold; color:#173b75;">Name:</label>
            <input type="text" name="name" placeholder="Enter your name"

        <div style="flex:1; min-width:280px;">

        </div>

        <div style="flex:1; min-width:280px;">
            <label style="font-weight:bold; color:#173b75;">Password:</label>
            <input type="password" name="password" placeholder="Enter your password"
            style="width:100%; padding:12px; margin:7px 0 18px; border:1px solid #4d8cff; border-radius:6px; box-sizing:border-box;">
        </div>

        <div style="flex:1; min-width:280px;">
            <label style="font-weight:bold; color:#173b75;">Phone:</label>

        </div>

        <div style="flex:1; min-width:280px;">

            <select name="course"
            style="width:100%; padding:12px; margin-top:7px; border:1px solid #4d8cff; border-radius:6px;">

                <option>Graphic Designing</option>
